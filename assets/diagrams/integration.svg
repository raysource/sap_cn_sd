<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 660" width="1300" height="660" role="img" aria-label="SD 与 FI / MM / PP / CO 的集成结构图" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>SD 与 FI / MM / PP / CO 的集成结构图</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<rect width="1300" height="660" fill="#ffffff"/>
<text x="40.0" y="48.0" font-size="20" fill="#1d2d3e" text-anchor="start" font-weight="700">SD 与其它模块的集成（一张图看数据往哪流）</text>
<text x="40.0" y="70.0" font-size="13" fill="#6b7a8d" text-anchor="start" font-weight="400">SD 只负责「卖」；真正扣库存、记收入、拉生产的是邻居模块（本站自绘）</text>
<rect x="500.0" y="300.0" width="300.0" height="150.0" rx="14" fill="#0854a0" stroke="#0854a0" stroke-width="1.4"/>
<text x="650.0" y="348.0" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">SD 销售与分销</text>
<text x="650.0" y="376.0" font-size="13.5" fill="#dbeafd" text-anchor="middle" font-weight="400">订单 · 交货 · 发票</text>
<text x="650.0" y="400.0" font-size="12" fill="#a9cdf3" text-anchor="middle" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">VA01 / VL01N / VF01</text>
<text x="650.0" y="424.0" font-size="11.5" fill="#a9cdf3" text-anchor="middle" font-weight="400">驱动的都只是 SD 自己的凭证</text>
<rect x="60.0" y="140.0" width="380.0" height="140.0" rx="11" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="60.0" y="140.0" width="4.5" height="140.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="74.0" y="166.0" font-size="16" fill="#007272" text-anchor="start" font-weight="700">MM 物料管理</text>
<text x="74.0" y="186.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">库存与采购</text>
<text x="74.0" y="208.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发货过账 601 才真正扣库存（SD 只交货不扣账）</text>
<text x="74.0" y="224.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">无库存 → 交货无法创建（教材里用 MB1C 501 录入期初库存解决）</text>
<text x="74.0" y="240.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">采购收货 101 增加可用库存，影响订单的可用性检查结果</text>
<text x="74.0" y="268.0" font-size="11" fill="#007272" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">MB1C / MIGO / MB52 / MD04</text>
<line x1="440.0" y1="210.0" x2="500.0" y2="375.0" stroke="#007272" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="500.0" y1="400.0" x2="440.0" y2="232.0" stroke="#007272" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="60.0" y="420.0" width="380.0" height="140.0" rx="11" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.4"/>
<rect x="60.0" y="420.0" width="4.5" height="140.0" rx="2" fill="#5b3fa8" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="74.0" y="446.0" font-size="16" fill="#5b3fa8" text-anchor="start" font-weight="700">FI 财务会计</text>
<text x="74.0" y="466.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">应收 / 收入 / 税</text>
<text x="74.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发票过账（VF02）生成会计凭证：借 客户应收 / 贷 收入 + 销项税</text>
<text x="74.0" y="504.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">科目由 VKOA「账户确定」+ 物料/客户账户分配组推出</text>
<text x="74.0" y="520.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">收款 F-28 冲销应收，可用 FBL5N 查看客户未清项</text>
<text x="74.0" y="548.0" font-size="11" fill="#5b3fa8" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">FS00 / VKOA / F-28 / FBL5N</text>
<line x1="440.0" y1="490.0" x2="500.0" y2="375.0" stroke="#5b3fa8" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="500.0" y1="400.0" x2="440.0" y2="512.0" stroke="#5b3fa8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="860.0" y="140.0" width="380.0" height="140.0" rx="11" fill="#ffffff" stroke="#8d6e00" stroke-width="1.4"/>
<rect x="860.0" y="140.0" width="4.5" height="140.0" rx="2" fill="#8d6e00" stroke="#8d6e00" stroke-width="1.4"/>
<text x="874.0" y="166.0" font-size="16" fill="#8d6e00" text-anchor="start" font-weight="700">PP 生产计划</text>
<text x="874.0" y="186.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">需求传递与供给</text>
<text x="874.0" y="208.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">订单项目的需求类型/需求类别把需求传给 MRP（MD04）</text>
<text x="874.0" y="224.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">MTO 场景：需求进「个别客户库存」而不是自由库存</text>
<text x="874.0" y="240.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">MTS 场景：先有计划独立需求（MD61），订单只是消耗预测</text>
<text x="874.0" y="268.0" font-size="11" fill="#8d6e00" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">MD04 / MD01N / CO01 / MD61</text>
<line x1="860.0" y1="210.0" x2="800.0" y2="375.0" stroke="#8d6e00" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="800.0" y1="400.0" x2="860.0" y2="232.0" stroke="#8d6e00" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="860.0" y="420.0" width="380.0" height="140.0" rx="11" fill="#ffffff" stroke="#177245" stroke-width="1.4"/>
<rect x="860.0" y="420.0" width="4.5" height="140.0" rx="2" fill="#177245" stroke="#177245" stroke-width="1.4"/>
<text x="874.0" y="446.0" font-size="16" fill="#177245" text-anchor="start" font-weight="700">CO 管理会计</text>
<text x="874.0" y="466.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">收入与成本对象</text>
<text x="874.0" y="488.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">收入按账户确定进 CO-PA 获利分析（收入要素）</text>
<text x="874.0" y="504.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">ETO/项目场景：收入上 WBS，结算用 CJ88 等</text>
<text x="874.0" y="520.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">成本对象决定边际贡献怎么算</text>
<text x="874.0" y="548.0" font-size="11" fill="#177245" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">KKA2 / CJ88 / VA88 / KO88</text>
<line x1="860.0" y1="490.0" x2="800.0" y2="375.0" stroke="#177245" stroke-width="2.0" marker-end="url(#ar)"/>
<line x1="800.0" y1="400.0" x2="860.0" y2="512.0" stroke="#177245" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="470.0" y="470.0" width="360.0" height="118.0" rx="10" fill="#f7fafc" stroke="#d9e1e8" stroke-width="1.4"/>
<text x="488.0" y="496.0" font-size="14" fill="#1d2d3e" text-anchor="start" font-weight="700">共用的「技术底座」</text>
<text x="488.0" y="516.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">组织数据（公司代码 / 工厂 / 销售组织）、主数据（客户 /</text>
<text x="488.0" y="532.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">物料）、编号范围、单据流——SD</text>
<text x="488.0" y="548.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">与邻居模块读同一套数据，所以配置顺序是「先组织、后主数据</text>
<text x="488.0" y="564.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">、最后单据」。</text>
</svg>
