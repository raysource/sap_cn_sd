<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 900" width="1420" height="900" role="img" aria-label="SD 端到端流程图（Order to Cash）" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>SD 端到端流程图（Order to Cash）</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<rect width="1420" height="900" fill="#ffffff"/>
<text x="40.0" y="48.0" font-size="20" fill="#1d2d3e" text-anchor="start" font-weight="700">端到端流程图：从询价到收款（Order to Cash）</text>
<text x="40.0" y="70.0" font-size="13" fill="#6b7a8d" text-anchor="start" font-weight="400">上排 = SD 的动作，中排 = 库存/装运真正发生的事，下排 = 财务被触发的时点（本站自绘）</text>
<rect x="40.0" y="78.0" width="1340.0" height="240.0" rx="12" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.0"/>
<text x="56.0" y="102.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">SD 销售与分销</text>
<rect x="40.0" y="332.0" width="1340.0" height="240.0" rx="12" fill="#e6f2f2" stroke="#007272" stroke-width="1.0"/>
<text x="56.0" y="356.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">MM 库存与装运</text>
<rect x="40.0" y="586.0" width="1340.0" height="240.0" rx="12" fill="#f4f0ff" stroke="#5b3fa8" stroke-width="1.0"/>
<text x="56.0" y="610.0" font-size="14" fill="#5b3fa8" text-anchor="start" font-weight="700">FI 财务会计</text>
<rect x="70.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="70.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="92.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="92.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="112.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">询价 VA11</text>
<text x="86.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">客户询问：要什么、要多少</text>
<text x="86.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">产出：询价单</text>
<line x1="314.0" y1="184.0" x2="338.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="342.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="342.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="364.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="364.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="384.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">报价 VA21</text>
<text x="358.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">正式报价，可含有效期</text>
<text x="358.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">产出：报价单</text>
<line x1="586.0" y1="184.0" x2="610.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="614.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="614.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="636.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="636.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="656.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">销售订单 VA01</text>
<text x="630.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">参照报价创建 OR 订单</text>
<text x="630.0" y="195.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">定价 + 可用性检查</text>
<text x="630.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">产出：销售订单</text>
<line x1="858.0" y1="184.0" x2="882.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="886.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="886.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="908.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="908.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="928.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">外向交货 VL01N</text>
<text x="902.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">按订单创建交货</text>
<text x="902.0" y="195.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">确定起运点/库存地点</text>
<text x="902.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">产出：交货单</text>
<line x1="1130.0" y1="184.0" x2="1154.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="1158.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="1158.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="1180.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="1180.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="1200.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">发票 VF01</text>
<text x="1174.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">参照交货开票</text>
<text x="1174.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">产出：发票 F2</text>
<rect x="310.0" y="384.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="310.0" y="384.0" width="4.5" height="108.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="326.0" y="410.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">可用性检查（ATP）</text>
<text x="326.0" y="432.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">订单保存时 / 交货创建时检查</text>
<text x="326.0" y="452.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">确认日期 = 最早能满足的日期</text>
<text x="326.0" y="478.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">库存不足仍可保存订单（除非设了块）</text>
<rect x="582.0" y="384.0" width="300.0" height="108.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="582.0" y="384.0" width="4.5" height="108.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="598.0" y="410.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">拣配 Picking</text>
<text x="598.0" y="432.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">确定并从库存地点取货（拣配数量）</text>
<text x="598.0" y="452.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">然后「发货过账」：移动类型 601</text>
<text x="598.0" y="478.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">→ 物料凭证 + 库存减少（教材用 MB1C 501 补期初库存）</text>
<rect x="914.0" y="384.0" width="300.0" height="108.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="914.0" y="384.0" width="4.5" height="108.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="930.0" y="410.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">发货过账的后效</text>
<text x="930.0" y="432.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">库存数量与金额同时减少（出库）</text>
<text x="930.0" y="452.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">交货状态变为「已完成」，可开票</text>
<text x="930.0" y="478.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">成本在 CO 侧体现（销货成本）</text>
<path d="M 430 238 L 430 384" fill="None" stroke="#007272" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<path d="M 732 238 L 732 384" fill="None" stroke="#007272" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<line x1="550.0" y1="438.0" x2="582.0" y2="438.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="882.0" y1="438.0" x2="914.0" y2="438.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M 1064 384 L 1064 300 L 990 300" fill="None" stroke="#007272" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="1000.0" y="292.0" font-size="11.5" fill="#007272" text-anchor="start" font-weight="400">发货完成才允许开票</text>
<rect x="640.0" y="638.0" width="340.0" height="108.0" rx="10" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.4"/>
<rect x="640.0" y="638.0" width="4.5" height="108.0" rx="2" fill="#5b3fa8" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="656.0" y="664.0" font-size="14" fill="#5b3fa8" text-anchor="start" font-weight="700">发票过账（下达）VF02</text>
<text x="656.0" y="686.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">点「保存 / 下达」→ 系统提示「凭证已经传送到记账」</text>
<text x="656.0" y="706.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">生成会计凭证：借 客户应收 / 贷 收入 + 销项税</text>
<text x="656.0" y="732.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">科目由 VKOA + 账户分配组推出</text>
<rect x="1020.0" y="638.0" width="340.0" height="108.0" rx="10" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.4"/>
<rect x="1020.0" y="638.0" width="4.5" height="108.0" rx="2" fill="#5b3fa8" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="1036.0" y="664.0" font-size="14" fill="#5b3fa8" text-anchor="start" font-weight="700">收款与清账</text>
<text x="1036.0" y="686.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">收到货款 → F-28 收款冲销应收（或 FBL5N 查看未清项）</text>
<text x="1036.0" y="706.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">流程闭环：现金回来了</text>
<text x="1036.0" y="732.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">本站流程以教材场景为准：交货 → 发票 → 过账</text>
<path d="M 900 238 L 900 560 L 810 560 L 810 638" fill="None" stroke="#5b3fa8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<line x1="980.0" y1="692.0" x2="1020.0" y2="692.0" stroke="#5b3fa8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="40.0" y="776.0" width="1340.0" height="96.0" rx="10" fill="#f7fafc" stroke="#d9e1e8" stroke-width="1.4"/>
<text x="56.0" y="802.0" font-size="14" fill="#1d2d3e" text-anchor="start" font-weight="700">单据流（Document Flow）：每个下游单据都「参照」上游单据创建，串成一条链</text>
<rect x="56.0" y="816.0" width="67.5" height="36.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.3"/>
<text x="71.0" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">询价单</text>
<line x1="125.5" y1="834.0" x2="143.5" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="147.5" y="816.0" width="67.5" height="36.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.3"/>
<text x="162.5" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">报价单</text>
<line x1="217.0" y1="834.0" x2="235.0" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="239.0" y="816.0" width="80.0" height="36.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.3"/>
<text x="254.0" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">销售订单</text>
<line x1="321.0" y1="834.0" x2="339.0" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="343.0" y="816.0" width="67.5" height="36.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.3"/>
<text x="358.0" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">交货单</text>
<line x1="412.5" y1="834.0" x2="430.5" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="434.5" y="816.0" width="55.0" height="36.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.3"/>
<text x="449.5" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">发票</text>
<line x1="491.5" y1="834.0" x2="509.5" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="513.5" y="816.0" width="80.0" height="36.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.3"/>
<text x="528.5" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">会计凭证</text>
<text x="56.0" y="868.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">核对方法：VA03（订单）→ 环境 → 显示单据流；或 VF03（发票）→ 抬头 → 点原始凭证，可一路点回销售订单，确认「这三个环节串在一条链上」。</text>
</svg>
