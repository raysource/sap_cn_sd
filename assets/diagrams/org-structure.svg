<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" width="1360" height="820" role="img" aria-label="SAP SD 组织结构图" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>SAP SD 组织结构图</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<rect width="1360" height="820" fill="#ffffff"/>
<text x="40.0" y="48.0" font-size="20" fill="#1d2d3e" text-anchor="start" font-weight="700">SD 组织结构（企业结构 → 销售结构 → 装运结构）</text>
<text x="40.0" y="70.0" font-size="13" fill="#6b7a8d" text-anchor="start" font-weight="400">同一套组织数据同时决定：主数据怎么建、单据怎么跑、库存从哪发、收入怎么记账（本站自绘）</text>
<text x="60.0" y="110.0" font-size="15" fill="#0854a0" text-anchor="start" font-weight="700">A. 企业结构（Enterprise Structure）</text>
<rect x="60.0" y="122.0" width="300.0" height="74.0" rx="9" fill="#e3f0fa" stroke="#0854a0" stroke-width="1.4"/>
<rect x="60.0" y="122.0" width="4.5" height="74.0" rx="2" fill="#0854a0" stroke="#0854a0" stroke-width="1.4"/>
<text x="72.0" y="144.0" font-size="14" fill="#0854a0" text-anchor="start" font-weight="700">公司代码 / 公司</text>
<text x="72.0" y="162.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">财务报表与会计的最小单位</text>
<rect x="60.0" y="216.0" width="300.0" height="74.0" rx="9" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="60.0" y="216.0" width="4.5" height="74.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="72.0" y="238.0" font-size="14" fill="#0a6ed1" text-anchor="start" font-weight="700">销售组织 (Sales Organization)</text>
<text x="72.0" y="256.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">负责销售的法律单位：产品责任、销售统计</text>
<rect x="60.0" y="310.0" width="300.0" height="74.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="60.0" y="310.0" width="4.5" height="74.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="72.0" y="332.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">工厂 (Plant)</text>
<text x="72.0" y="350.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">生产 / 库存地点所属的组织单位（发货从这里发生）</text>
<rect x="60.0" y="404.0" width="300.0" height="74.0" rx="9" fill="#f7fafc" stroke="#6b7a8d" stroke-width="1.4"/>
<rect x="60.0" y="404.0" width="4.5" height="74.0" rx="2" fill="#6b7a8d" stroke="#6b7a8d" stroke-width="1.4"/>
<text x="72.0" y="426.0" font-size="14" fill="#6b7a8d" text-anchor="start" font-weight="700">采购组织 / 装运点协调</text>
<text x="72.0" y="444.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">跨模块共用：SD 只关心工厂与库存</text>
<path d="M 210 196 L 210 216" fill="none" stroke="#0a6ed1" stroke-width="1.6"/>
<path d="M 210 290 L 210 310" fill="none" stroke="#007272" stroke-width="1.6"/>
<path d="M 210 384 L 210 404" fill="none" stroke="#6b7a8d" stroke-width="1.6"/>
<line x1="360.0" y1="160.0" x2="470.0" y2="160.0" stroke="#0a6ed1" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M 360 253 L 470 253" fill="none" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="480.0" y="110.0" font-size="15" fill="#007272" text-anchor="start" font-weight="400">B. 销售结构（Sales Structure）</text>
<rect x="480.0" y="122.0" width="250.0" height="74.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="480.0" y="122.0" width="4.5" height="74.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="492.0" y="144.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">分销渠道</text>
<text x="492.0" y="162.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">产品如何到达客户：直销 / 批发 / 零售</text>
<rect x="480.0" y="216.0" width="250.0" height="74.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="480.0" y="216.0" width="4.5" height="74.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="492.0" y="238.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">产品组</text>
<text x="492.0" y="256.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">把产品按线分组：整机 / 备件 / 服务</text>
<rect x="480.0" y="310.0" width="250.0" height="74.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="480.0" y="310.0" width="4.5" height="74.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="492.0" y="332.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">销售办公室</text>
<text x="492.0" y="350.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">地理 / 责任范围（按地区划分的销售机构）</text>
<rect x="480.0" y="404.0" width="250.0" height="74.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="480.0" y="404.0" width="4.5" height="74.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="492.0" y="426.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">销售组</text>
<text x="492.0" y="444.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">销售办公室内的人员小组（分担责任）</text>
<path d="M 605 290 L 605 310" fill="none" stroke="#007272" stroke-width="1.6"/>
<line x1="730.0" y1="160.0" x2="830.0" y2="160.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M 730 253 L 830 253" fill="none" stroke="#007272" stroke-width="1.6"/>
<path d="M 730 347 L 830 347" fill="none" stroke="#007272" stroke-width="1.6"/>
<text x="840.0" y="110.0" font-size="15" fill="#5b3fa8" text-anchor="start" font-weight="400">C. 销售范围 = 销售组织 + 分销渠道 + 产品组</text>
<rect x="840.0" y="122.0" width="460.0" height="116.0" rx="10" fill="#f4f0ff" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="856.0" y="148.0" font-size="15" fill="#5b3fa8" text-anchor="start" font-weight="700">销售范围（Sales Area）</text>
<text x="856.0" y="168.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">业务含义：某个销售组织「通过某种分销渠道」经营「某个产品组」。它决定客户主</text>
<text x="856.0" y="184.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">数据、物料主数据（销售视图）、条件记录与所有销售单据的组织键，也是定价过程</text>
<text x="856.0" y="200.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">确定、账户确定的输入。</text>
<rect x="840.0" y="250.0" width="460.0" height="84.0" rx="10" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="856.0" y="274.0" font-size="13" fill="#177245" text-anchor="start" font-weight="700">例（教材场景 颐宁）</text>
<text x="856.0" y="294.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">1 个销售组织 × 2 个分销渠道（直销 / 批发）× 2 个产品组 → 4</text>
<text x="856.0" y="310.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">个销售范围，逐一设置。</text>
<rect x="840.0" y="346.0" width="460.0" height="84.0" rx="10" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="856.0" y="370.0" font-size="13" fill="#0854a0" text-anchor="start" font-weight="700">销售办公室 / 销售组</text>
<text x="856.0" y="390.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">分配到销售范围（后台）：用于统计与权限，不影响单价的确定。</text>
<text x="60.0" y="520.0" font-size="15" fill="#007272" text-anchor="start" font-weight="400">D. 装运结构（Shipping）</text>
<rect x="60.0" y="532.0" width="210.0" height="96.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="60.0" y="532.0" width="4.5" height="96.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="72.0" y="554.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">起运点</text>
<text x="72.0" y="572.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发货的起始地点（与工厂多对多）</text>
<text x="72.0" y="587.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">教材例：Z999 颐宁装运点</text>
<rect x="290.0" y="532.0" width="210.0" height="96.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="290.0" y="532.0" width="4.5" height="96.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="302.0" y="554.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">装载点</text>
<text x="302.0" y="572.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">装货的具体位置（按起运点分配）</text>
<rect x="520.0" y="532.0" width="210.0" height="96.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="520.0" y="532.0" width="4.5" height="96.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="532.0" y="554.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">拣配库存地点</text>
<text x="532.0" y="572.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">从哪个库存地点拣货（按起运点 +</text>
<text x="532.0" y="587.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工厂 + 存储条件确定）</text>
<rect x="750.0" y="532.0" width="210.0" height="96.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="750.0" y="532.0" width="4.5" height="96.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="762.0" y="554.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">运送条件</text>
<text x="762.0" y="572.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">交货的运输方式与时间（与物料 /</text>
<text x="762.0" y="587.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工厂共同决定起运点）</text>
<rect x="980.0" y="532.0" width="210.0" height="96.0" rx="9" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="980.0" y="532.0" width="4.5" height="96.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="992.0" y="554.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">装载组</text>
<text x="992.0" y="572.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">与物料主数据共同决定装载点</text>
<line x1="255.0" y1="580.0" x2="290.0" y2="580.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="485.0" y1="580.0" x2="520.0" y2="580.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="715.0" y1="580.0" x2="750.0" y2="580.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="945.0" y1="580.0" x2="980.0" y2="580.0" stroke="#007272" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="60.0" y="656.0" width="1240.0" height="124.0" rx="10" fill="#f7fafc" stroke="#d9e1e8" stroke-width="1.4"/>
<text x="76.0" y="682.0" font-size="14" fill="#1d2d3e" text-anchor="start" font-weight="700">系统怎么自动找到这些组织数据（自动确定的链条）</text>
<rect x="76.0" y="700.0" width="194.5" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="87.0" y="722.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">客户主数据（销售范围层的客户）</text>
<line x1="278.5" y1="717.0" x2="290.5" y2="717.0" stroke="#0a6ed1" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="296.5" y="700.0" width="192.1" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="307.5" y="722.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">销售凭证类型（如 OR 标准订单）</text>
<line x1="496.6" y1="717.0" x2="508.6" y2="717.0" stroke="#0a6ed1" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="514.6" y="700.0" width="137.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="525.6" y="722.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">输入物料的物料主数据</text>
<line x1="659.6" y1="717.0" x2="671.6" y2="717.0" stroke="#0a6ed1" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="677.6" y="700.0" width="141.9" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="688.6" y="722.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">工厂 / 起运点 / 装运点</text>
<line x1="827.5" y1="717.0" x2="839.5" y2="717.0" stroke="#0a6ed1" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="845.5" y="700.0" width="91.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="856.5" y="722.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">拣配库存地点</text>
<text x="76.0" y="752.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">关键：组织数据不是「每次手输」——单据抬头/项目的销售范围由客户主数据带出、工厂由物料主数据与装运条件推出、库存地点由后台配置决定。配置错了，单据就跑不起来或跑到错的库存。</text>
</svg>
