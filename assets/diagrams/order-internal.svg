<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 880" width="1340" height="880" role="img" aria-label="销售订单内部处理流程图" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>销售订单内部处理流程图</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<rect width="1340" height="880" fill="#ffffff"/>
<text x="40.0" y="48.0" font-size="20" fill="#1d2d3e" text-anchor="start" font-weight="700">销售订单的内部处理：一张图看懂「自动确定」</text>
<text x="40.0" y="70.0" font-size="13" fill="#6b7a8d" text-anchor="start" font-weight="400">在 VA01 里你只输了几行信息，系统在后面做了这些事（本站自绘）</text>
<rect x="60.0" y="116.0" width="700.0" height="142.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="60.0" y="116.0" width="4.5" height="142.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="78.0" y="144.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">① 输入抬头</text>
<text x="78.0" y="166.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 订单类型（教材：OR 标准订单）</text>
<text x="78.0" y="183.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 售达方 / 送达方 / 收票方 / 付款方</text>
<text x="78.0" y="200.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 订单日期、采购订单号（客户 PO）</text>
<text x="78.0" y="217.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 销售范围：从客户主数据带出</text>
<rect x="60.0" y="270.0" width="700.0" height="122.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="60.0" y="270.0" width="4.5" height="122.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="78.0" y="298.0" font-size="15.5" fill="#0a6ed1" text-anchor="start" font-weight="700">② 输入项目</text>
<text x="78.0" y="320.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 物料 + 数量 + 交货日期</text>
<text x="78.0" y="337.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 工厂（由物料主数据 / 装运条件推出）</text>
<text x="78.0" y="354.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 价格从条件记录里「找」出来</text>
<rect x="60.0" y="404.0" width="700.0" height="142.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="60.0" y="404.0" width="4.5" height="142.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="78.0" y="432.0" font-size="15.5" fill="#007272" text-anchor="start" font-weight="700">③ 自动确定</text>
<text x="78.0" y="454.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 项目类别（TAN 等）：订单类型 + 物料 → 决定是否定价/交货/开票</text>
<text x="78.0" y="471.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 定价过程：销售范围 + 客户定价过程 + 单据定价过程 → 逐行算价</text>
<text x="78.0" y="488.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 税分类 + 税码 → 销项税</text>
<text x="78.0" y="505.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 合作伙伴：从客户主数据带出售达方等角色</text>
<rect x="60.0" y="558.0" width="700.0" height="122.0" rx="10" fill="#ffffff" stroke="#8d6e00" stroke-width="1.4"/>
<rect x="60.0" y="558.0" width="4.5" height="122.0" rx="2" fill="#8d6e00" stroke="#8d6e00" stroke-width="1.4"/>
<text x="78.0" y="586.0" font-size="15.5" fill="#8d6e00" text-anchor="start" font-weight="700">④ 检查</text>
<text x="78.0" y="608.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 可用性检查 ATP：确认交货日期（不足也能存单，除非设了块）</text>
<text x="78.0" y="625.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 不完整性检查：必填字段没填就存不下（能存单但在单据流里标红）</text>
<text x="78.0" y="642.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 信贷管理（若启用）：超额则自动加交货冻结</text>
<rect x="60.0" y="692.0" width="700.0" height="142.0" rx="10" fill="#ffffff" stroke="#177245" stroke-width="1.4"/>
<rect x="60.0" y="692.0" width="4.5" height="142.0" rx="2" fill="#177245" stroke="#177245" stroke-width="1.4"/>
<text x="78.0" y="720.0" font-size="15.5" fill="#177245" text-anchor="start" font-weight="700">⑤ 保存与后效</text>
<text x="78.0" y="742.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 生成销售订单号，进入单据流</text>
<text x="78.0" y="759.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 需求传给 MRP / 计划（MD04 可见）</text>
<text x="78.0" y="776.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 输出确定：订单确认单可打印/发邮件</text>
<text x="78.0" y="793.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 状态字段更新，供 VA05 与后续环节使用</text>
<rect x="800.0" y="116.0" width="500.0" height="190.0" rx="11" fill="#e3f0fa" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="818.0" y="144.0" font-size="14.5" fill="#0a6ed1" text-anchor="start" font-weight="700">决定链 1：项目类别（Item Category）</text>
<rect x="818.0" y="160.0" width="88.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="829.0" y="182.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">销售凭证类型</text>
<line x1="907.0" y1="177.0" x2="921.0" y2="177.0" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="924.0" y="160.0" width="154.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="935.0" y="182.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">物料主数据（项目类别组）</text>
<line x1="1079.0" y1="177.0" x2="1093.0" y2="177.0" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="1096.0" y="160.0" width="110.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="1107.0" y="182.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">用途（用途字段）</text>
<path d="M 1207 177 h 10 v 44 h -413 h 12" fill="none" stroke="#0a6ed1" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="818.0" y="204.0" width="143.0" height="34.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.2"/>
<text x="829.0" y="226.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">上层项目（空值也是键）</text>
<text x="818.0" y="274.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">决定「这一行怎么处理」：要不要定价、要不要交货、要不要开票、库存从哪来（特别库存</text>
<text x="818.0" y="291.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400"> E 等）。教材工具：VOV4 / VOV7。</text>
<rect x="800.0" y="322.0" width="500.0" height="163.0" rx="11" fill="#e6f2f2" stroke="#007272" stroke-width="1.4"/>
<text x="818.0" y="350.0" font-size="14.5" fill="#007272" text-anchor="start" font-weight="700">决定链 2：定价过程（Pricing Procedure）</text>
<rect x="818.0" y="366.0" width="66.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="829.0" y="388.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">销售范围</text>
<line x1="885.0" y1="383.0" x2="899.0" y2="383.0" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="902.0" y="366.0" width="88.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="913.0" y="388.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">客户定价过程</text>
<line x1="991.0" y1="383.0" x2="1005.0" y2="383.0" stroke="#007272" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="1008.0" y="366.0" width="88.0" height="34.0" rx="8" fill="#ffffff" stroke="#007272" stroke-width="1.2"/>
<text x="1019.0" y="388.0" font-size="11" fill="#354a5f" text-anchor="start" font-weight="400">单据定价过程</text>
<text x="818.0" y="436.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">三个键定出唯一一套过程（教材用</text>
<text x="818.0" y="453.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">RVAA01），过程里按步骤列出条件类型。IMG：销售和分销 → 基本功能 → 定价 → 定价控制</text>
<text x="818.0" y="470.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400"> → 定义并分配定价过程。</text>
<rect x="800.0" y="501.0" width="500.0" height="119.0" rx="11" fill="#e6f2ec" stroke="#177245" stroke-width="1.4"/>
<text x="818.0" y="529.0" font-size="14.5" fill="#177245" text-anchor="start" font-weight="700">决定链 3：账户确定（记账科目）</text>
<text x="818.0" y="571.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">发票过账时：账码（ERL 等，来自定价过程）+ 物料账户分配组 + 客户账户分配组 →</text>
<text x="818.0" y="588.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">查表（VKOA）→ 收入科目。</text>
<text x="818.0" y="605.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">所以「收入记到哪个科目」既不是写死在程序里，也不是手输的。</text>
</svg>
